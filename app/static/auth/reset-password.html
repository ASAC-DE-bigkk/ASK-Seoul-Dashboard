<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>비밀번호 재설정 · ASK SEOUL</title><link rel="stylesheet" href="/static/auth/auth.css"></head>
<body><div class="auth-page"><nav class="auth-nav"><a class="brand" href="/"><span class="brand-mark">AS</span>ASK SEOUL</a></nav>
<main class="auth-main"><section class="auth-card"><div class="eyebrow">Reset password</div><h1>새 비밀번호 설정</h1>
<p class="lead">변경이 완료되면 기존 로그인 세션이 모두 종료됩니다.</p><div id="message" class="message info" hidden></div>
<form id="reset-form" class="form"><div class="field"><label for="password">새 비밀번호</label><input id="password" name="password" type="password" autocomplete="new-password" maxlength="128" required>
<span class="hint">15~128자의 충분히 긴 문장형 비밀번호를 권장합니다.</span></div>
<div class="field"><label for="password-confirm">새 비밀번호 확인</label><input id="password-confirm" name="password_confirm" type="password" autocomplete="new-password" maxlength="128" required></div>
<button class="btn primary" type="submit">비밀번호 변경</button></form></section></main>
<footer class="auth-foot">재설정 후 자동 로그인하지 않습니다.</footer></div>
<script src="/static/auth/session-ui.js"></script><script src="/static/auth/auth-pages.js"></script><script>setupReset()</script></body></html>
