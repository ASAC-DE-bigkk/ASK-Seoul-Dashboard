<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASK SEOUL · Data Marketplace</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --accent: #2a78d6; --accent-deep: #1c5cab; --accent-soft: #e8f0fb;
    --good: #0ca30c; --warn: #fab219; --serious: #ec835a;
    --good-soft: #e9f6e9;
    --side-bg: #0d1830; --side-ink: #c7d3e8; --side-dim: #64769a; --side-line: #1e2c4a;
    --ink: #17202e; --ink-2: #4c5768; --ink-3: #8a94a6;
    --line: #dfe4ec; --line-soft: #eaeef4;
    --bg: #f4f6fa; --panel: #ffffff;
    --mono: "Cascadia Mono", Consolas, monospace;
    --shadow: 0 1px 2px rgba(16,30,54,.04), 0 3px 12px rgba(16,30,54,.05);
    --shadow-lift: 0 4px 10px rgba(16,30,54,.08), 0 14px 34px rgba(16,30,54,.12);
  }
  * { box-sizing: border-box; margin: 0; }
  html { font-size: 14px; }
  body { font-family: "Pretendard Variable", Pretendard, "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
         background: var(--bg); color: var(--ink); line-height: 1.55;
         height: 100vh; overflow: hidden; display: flex; }
  .num { font-variant-numeric: tabular-nums; }
  button { font: inherit; cursor: pointer; }

  /* ── sidebar ─────────────────────────────────────────── */
  .side { width: 218px; flex: none; background: var(--side-bg); color: var(--side-ink);
          display: flex; flex-direction: column; padding: 18px 14px; gap: 4px; }
  .logo { display: flex; align-items: center; gap: 10px; padding: 4px 10px 16px; }
  .logo .mark { width: 30px; height: 30px; border-radius: 9px; flex: none;
                background: linear-gradient(135deg, #2a78d6 0%, #123a76 100%);
                display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 13.5px; }
  .logo .t b { display: block; font-size: 14px; color: #fff; letter-spacing: .02em; }
  .logo .t span { font-size: 11px; color: var(--side-dim); }
  .side .sec { font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
               color: var(--side-dim); padding: 14px 10px 6px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px;
              color: var(--side-ink); font-size: 13px; font-weight: 500; text-decoration: none;
              border: none; background: none; width: 100%; text-align: left; }
  .nav-item svg { width: 16px; height: 16px; flex: none; opacity: .75; }
  .nav-item.on { background: rgba(42,120,214,.22); color: #fff; }
  .nav-item.on svg { opacity: 1; }
  .nav-item:hover:not(.on):not(.soon) { background: rgba(255,255,255,.05); }
  .nav-item.soon { color: var(--side-dim); cursor: default; }
  .nav-item .tag { margin-left: auto; font-size: 9.5px; font-weight: 700; letter-spacing: .06em;
                   color: var(--side-dim); border: 1px solid var(--side-line); border-radius: 999px; padding: 1px 7px; }
  .nav-item.on .tag { color: #9ec5f4; border-color: rgba(120,170,230,.4); }
  .side .foot { margin-top: auto; padding: 12px 10px 2px; border-top: 1px solid var(--side-line);
                font-size: 11px; color: var(--side-dim); line-height: 1.6; }
  .side .foot b { color: var(--side-ink); font-weight: 600; }

  /* ── main ────────────────────────────────────────────── */
  .main { flex: 1; overflow-y: auto; scrollbar-gutter: stable; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 30px 34px 60px; }

  .hero { display: flex; align-items: flex-end; gap: 20px; margin-bottom: 18px; }
  .hero h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.015em; }
  .hero p { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
  .hero .right { margin-left: auto; text-align: right; font-size: 11.5px; color: var(--ink-3); }
  .hero .right a { color: var(--accent-deep); font-weight: 650; text-decoration: none; }
  .hero .right a:hover { text-decoration: underline; }

  .searchbar { position: relative; margin-bottom: 16px; }
  .searchbar svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
                   width: 16px; height: 16px; color: var(--ink-3); pointer-events: none; }
  .searchbar input { width: 100%; padding: 11px 16px 11px 40px; font-size: 14px; font-family: inherit;
                     border: 1px solid var(--line); border-radius: 10px; background: var(--panel);
                     box-shadow: var(--shadow); }
  .searchbar input:focus { outline: 3px solid var(--accent-soft); border-color: var(--accent); }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
           gap: 12px; margin-bottom: 20px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 11px;
          padding: 12px 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; }
  .stat .label { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
  .stat .value { font-size: 22px; font-weight: 750; letter-spacing: -0.01em; margin-top: 1px; }
  .stat .value .unit { font-size: 12.5px; font-weight: 600; color: var(--ink-3); margin-left: 3px; }
  .stat .sub { font-size: 11.5px; color: var(--ink-2); }

  .listhead { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .listhead h2 { font-size: 14.5px; font-weight: 750; }
  .listhead .count { font-size: 12px; color: var(--ink-3); }
  .view-toggle { margin-left: auto; display: flex; border: 1px solid var(--line); border-radius: 8px;
                 overflow: hidden; background: var(--panel); }
  .view-toggle button { border: none; background: none; padding: 6px 12px; font-size: 12px;
                        font-weight: 600; color: var(--ink-3); display: flex; align-items: center; gap: 6px; }
  .view-toggle button svg { width: 13px; height: 13px; }
  .view-toggle button.on { background: var(--accent-soft); color: var(--accent-deep); }

  /* ── cards ───────────────────────────────────────────── */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
  .card { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 13px;
          padding: 16px 18px 14px; box-shadow: var(--shadow); cursor: pointer; overflow: hidden;
          display: flex; flex-direction: column; gap: 10px;
          transition: box-shadow .16s ease, transform .16s ease, border-color .16s ease; }
  .card::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--c, var(--accent)); }
  .card:hover { box-shadow: var(--shadow-lift); transform: translateY(-3px); border-color: transparent; }
  .card .head { display: flex; align-items: center; gap: 11px; }
  .card .icon { width: 38px; height: 38px; flex: none; border-radius: 10px; display: grid; place-items: center;
                background: color-mix(in srgb, var(--c) 12%, white); color: var(--c); }
  .card .icon svg { width: 19px; height: 19px; }
  .card .tt { min-width: 0; }
  .card .tt .nm { font-family: var(--mono); font-size: 13px; font-weight: 650; letter-spacing: -0.01em;
                  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .tt .cat { font-size: 11px; color: var(--ink-3); font-weight: 600; letter-spacing: .04em; }
  .card p.desc { font-size: 12.5px; color: var(--ink-2); line-height: 1.55; min-height: 39px;
                 display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .facts { display: flex; gap: 14px; font-size: 12px; color: var(--ink-2); }
  .card .facts b { font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
  .card .facts .f { display: flex; flex-direction: column; }
  .card .facts .f span { font-size: 10px; font-weight: 700; letter-spacing: .07em;
                         text-transform: uppercase; color: var(--ink-3); }
  .card .foot { display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--line-soft);
                padding-top: 10px; margin-top: 2px; }
  .card .foot .qwrap { flex: 1; min-width: 0; }
  .card .foot .qtext { font-size: 11px; color: var(--ink-2); margin-top: 3px; }
  .card .foot .qtext b { color: var(--good); }

  .pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 650;
          padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .pill.ok { background: var(--good-soft); color: #0a7d0a; }
  .pill.dim { background: var(--line-soft); color: var(--ink-2); }

  .meter { display: flex; height: 6px; border-radius: 4px; overflow: hidden; gap: 2px; background: var(--line-soft); }
  .meter i { display: block; height: 100%; }
  .meter i.g { background: var(--good); } .meter i.w { background: var(--warn); } .meter i.s { background: var(--serious); }

  /* ── list view ───────────────────────────────────────── */
  .listing { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
             box-shadow: var(--shadow); overflow: hidden; }
  .lrow { display: grid; grid-template-columns: minmax(300px,1fr) 105px 60px 185px 165px 100px;
          gap: 14px; align-items: center; padding: 9px 20px;
          border-top: 1px solid var(--line-soft); cursor: pointer; }
  .lrow:hover { background: #f6f9fd; }
  .lrow.head { background: #fafbfd; border-top: none; cursor: default; padding: 9px 20px;
               font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
               color: var(--ink-3); position: sticky; top: 0; z-index: 5; }
  .lrow .nmcell { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .lrow .micon { width: 28px; height: 28px; flex: none; border-radius: 8px; display: grid; place-items: center;
                 background: color-mix(in srgb, var(--c) 12%, white); color: var(--c); }
  .lrow .micon svg { width: 15px; height: 15px; }
  .lrow .id { font-family: var(--mono); font-size: 12.5px; font-weight: 650;
              overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lrow .ds { font-size: 11.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cell-num { text-align: right; font-variant-numeric: tabular-nums; font-size: 12.5px; }
  .cell-dim { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .qcell .qtext { font-size: 11px; color: var(--ink-2); margin-top: 3px; }
  .qcell .qtext b { color: var(--good); }

  /* ── skeleton ────────────────────────────────────────── */
  @keyframes shimmer { from { background-position: 200% 0 } to { background-position: -200% 0 } }
  .sk { border-radius: 8px; background: linear-gradient(90deg, #eceff5 25%, #f7f9fc 50%, #eceff5 75%);
        background-size: 200% 100%; animation: shimmer 1.3s infinite linear; }
  .sk-card { height: 172px; border-radius: 13px; }
  @media (prefers-reduced-motion: reduce) { .sk { animation: none } .card { transition: none } }

  /* ── drawer ──────────────────────────────────────────── */
  .overlay { position: fixed; inset: 0; background: rgba(13,24,48,.45); opacity: 0;
             pointer-events: none; transition: opacity .18s; z-index: 40; }
  .overlay.on { opacity: 1; pointer-events: auto; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(700px, 94vw);
            background: var(--panel); box-shadow: -16px 0 48px rgba(13,24,48,.22);
            transform: translateX(103%); transition: transform .22s ease; z-index: 50;
            display: flex; flex-direction: column; }
  .drawer.on { transform: translateX(0); }
  .d-head { padding: 22px 28px 0; border-bottom: 1px solid var(--line); }
  .d-head .top { display: flex; align-items: flex-start; gap: 13px; }
  .d-head .icon { width: 42px; height: 42px; flex: none; border-radius: 11px; display: grid; place-items: center;
                  background: color-mix(in srgb, var(--c) 12%, white); color: var(--c); }
  .d-head .icon svg { width: 21px; height: 21px; }
  .d-head h2 { font-family: var(--mono); font-size: 16px; font-weight: 650; word-break: break-all; }
  .d-head .rel { font-family: var(--mono); font-size: 11px; color: var(--ink-3); margin-top: 2px; }
  .d-head .close { margin-left: auto; flex: none; border: 1px solid var(--line); background: var(--panel);
                   border-radius: 8px; width: 30px; height: 30px; font-size: 13px; color: var(--ink-2); }
  .d-head .close:hover { background: var(--bg); }
  .d-meta { display: flex; flex-wrap: wrap; gap: 7px; margin: 13px 0 13px; }
  .tabs { display: flex; gap: 2px; }
  .tabs button { border: none; background: none; font-size: 12.5px; font-weight: 650;
                 color: var(--ink-2); padding: 9px 13px; border-bottom: 2px solid transparent; }
  .tabs button.on { color: var(--accent-deep); border-bottom-color: var(--accent); }
  .tabs button:hover { color: var(--ink); }
  .tabs button .n { font-size: 10.5px; color: var(--ink-3); margin-left: 3px; font-variant-numeric: tabular-nums; }
  .d-body { flex: 1; overflow-y: auto; padding: 20px 28px 34px; }
  .d-body h3 { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
               color: var(--ink-3); margin: 0 0 10px; }
  .d-body section + section { margin-top: 24px; }
  .d-body p.desc { font-size: 13.5px; }

  .kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 9px; }
  .kv .item { background: var(--bg); border: 1px solid var(--line-soft); border-radius: 9px; padding: 8px 12px; }
  .kv .k { font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
  .kv .v { font-size: 13px; font-weight: 650; margin-top: 1px; font-variant-numeric: tabular-nums; }

  table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  th, td { border-bottom: 1px solid var(--line-soft); padding: 7px 10px; text-align: left; vertical-align: top; }
  th { background: #fafbfd; font-size: 10.5px; font-weight: 700; letter-spacing: .07em;
       text-transform: uppercase; color: var(--ink-3); white-space: nowrap; border-bottom-color: var(--line); }
  tr:hover td { background: #f6f9fd; }
  td.mono, th.mono { font-family: var(--mono); font-size: 11.5px; white-space: nowrap; }
  td.num-cell { text-align: right; font-variant-numeric: tabular-nums; }
  .scroll-x { overflow-x: auto; border: 1px solid var(--line-soft); border-radius: 9px; }

  .qblock { border: 1px solid var(--line-soft); border-radius: 11px; padding: 13px 16px; }
  .qblock + .qblock { margin-top: 10px; }
  .qblock .src { font-family: var(--mono); font-size: 12.5px; font-weight: 650; }
  .qblock .total { font-size: 11.5px; color: var(--ink-3); margin-left: 6px; }
  .qblock .meter { height: 9px; margin: 10px 0 8px; border-radius: 5px; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 11.5px; color: var(--ink-2); }
  .legend .li { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
  .dot { width: 9px; height: 9px; border-radius: 3px; flex: none; }
  .dot.g { background: var(--good); } .dot.w { background: var(--warn); } .dot.s { background: var(--serious); }

  .flow { display: flex; flex-direction: column; }
  .stage { border: 1px solid var(--line-soft); border-radius: 10px; padding: 11px 15px; background: var(--bg); }
  .stage .t { font-size: 10px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase;
              color: var(--ink-3); margin-bottom: 6px; }
  .stage .names { display: flex; flex-wrap: wrap; gap: 6px; }
  .stage .names span { font-family: var(--mono); font-size: 11px; background: var(--panel);
                       border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; }
  .stage.gold { background: #fff9ef; border-color: #eddfb9; }
  .arrow { text-align: center; color: var(--ink-3); font-size: 12px; padding: 3px 0; }

  .api-list { display: flex; flex-direction: column; gap: 8px; }
  .api-list a { display: flex; align-items: center; gap: 10px; text-decoration: none;
                border: 1px solid var(--line-soft); border-radius: 9px; padding: 9px 14px; }
  .api-list a:hover { border-color: var(--accent); background: var(--accent-soft); }
  .api-list .verb { font-size: 10px; font-weight: 800; letter-spacing: .05em; color: var(--good);
                    background: var(--good-soft); border-radius: 5px; padding: 2px 7px; flex: none; }
  .api-list .path { font-family: var(--mono); font-size: 11.5px; color: var(--ink); word-break: break-all; }
  .api-list .what { margin-left: auto; font-size: 11px; color: var(--ink-3); white-space: nowrap; }

  .empty { padding: 46px; text-align: center; color: var(--ink-3); font-size: 13px; }
  @media (max-width: 900px) { .side { display: none } }
</style>
</head>
<body>

<aside class="side">
  <div class="logo">
    <div class="mark">AS</div>
    <div class="t"><b>ASK SEOUL</b><span>Data Marketplace</span></div>
  </div>
  <div class="sec">Domains</div>
  <button class="nav-item on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V9l8-6 8 6v10a1 1 0 01-1 1h-5v-6h-4v6H5a1 1 0 01-1-1z"/></svg>culture<span class="tag">6 live</span></button>
  <button class="nav-item soon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M10 4v16"/></svg>citydata<span class="tag">soon</span></button>
  <button class="nav-item soon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 20V10m6 10V4m6 16v-7"/></svg>commerce<span class="tag">soon</span></button>
  <button class="nav-item soon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3.6 9h16.8M3.6 15h16.8"/></svg>traffic<span class="tag">soon</span></button>
  <button class="nav-item soon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 18a4 4 0 100-8 5.5 5.5 0 00-10.4 1.5A3.5 3.5 0 007 18h10z"/></svg>weather<span class="tag">soon</span></button>
  <button class="nav-item soon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 11a3 3 0 100-6M21 20c0-2.8-1.9-5.1-4.5-5.8"/></svg>population<span class="tag">soon</span></button>
  <div class="sec">Resources</div>
  <a class="nav-item" href="/docs" target="_blank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 3h8l4 4v14a1 1 0 01-1 1H7a1 1 0 01-1-1V4a1 1 0 011-1z"/><path d="M15 3v4h4M9 13h6M9 17h6"/></svg>API Docs (Swagger)</a>
  <a class="nav-item" href="/health" target="_blank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Health</a>
  <div class="foot"><b>W3 demo</b> — 조회 전용 카탈로그 API<br>스냅샷 서빙 · dbt + Trino 실측</div>
</aside>

<main class="main">
  <div class="wrap">
    <div class="hero">
      <div>
        <h1>Culture Datasets</h1>
        <p>서울 문화 도메인의 published gold — 계약·품질·계보가 붙은 분석용 데이터 상품</p>
      </div>
      <div class="right num" id="snap"></div>
    </div>

    <div class="searchbar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="search" type="search" placeholder="데이터셋 이름·설명으로 검색  (예: 박스오피스, 행정동, 예약)" autocomplete="off">
    </div>

    <div class="stats" id="stats"></div>

    <div class="listhead">
      <h2>Published Datasets</h2>
      <span class="count num" id="count"></span>
      <div class="view-toggle" id="vt">
        <button id="vt-card" class="on" onclick="setView('card')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>카드</button>
        <button id="vt-list" onclick="setView('list')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>리스트</button>
      </div>
    </div>

    <div id="content">
      <div class="cards">
        <div class="sk sk-card"></div><div class="sk sk-card"></div><div class="sk sk-card"></div>
        <div class="sk sk-card"></div><div class="sk sk-card"></div><div class="sk sk-card"></div>
      </div>
    </div>
  </div>
</main>

<div class="overlay" id="overlay" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer" aria-label="dataset detail">
  <div class="d-head">
    <div class="top">
      <div class="icon" id="d-icon"></div>
      <div style="min-width:0">
        <h2 id="d-title"></h2>
        <div class="rel" id="d-rel"></div>
      </div>
      <button class="close" onclick="closeDrawer()" aria-label="닫기">✕</button>
    </div>
    <div class="d-meta" id="d-meta"></div>
    <nav class="tabs" id="tabs"></nav>
  </div>
  <div class="d-body" id="d-body"></div>
</aside>

<script>
/* 데이터셋별 고정 아이덴티티 — 색은 dataviz categorical 슬롯을 이름순으로 고정 배정 */
const IDENT = {
  gold_culture_activity_by_dong:      { c: '#2a78d6', cat: '공간 집계 · 행정동',
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-6.5-5.2-6.5-10a6.5 6.5 0 1113 0c0 4.8-6.5 10-6.5 10z"/><circle cx="12" cy="10.5" r="2.5"/></svg>' },
  gold_culture_boxoffice_daily:       { c: '#1baf7a', cat: '공연 · 랭킹 스냅샷',
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8a2 2 0 002-2h12a2 2 0 002 2v3a2 2 0 000 4v3a2 2 0 00-2 2H6a2 2 0 00-2-2v-3a2 2 0 000-4V8z"/><path d="M13 6v12" stroke-dasharray="2 3"/></svg>' },
  gold_culture_location_daily:        { c: '#eda100', cat: '공간 집계 · 자치구',
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 20l-5-2V5l5 2m0 13l6-2m-6 2V7m6 11l5 2V8l-5-2m0 12V6M9 7l6-2"/></svg>' },
  gold_culture_movie_boxoffice_daily: { c: '#008300', cat: '영화 · 관객 비중',
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M7 4v5m5-5v5m5-5v5"/></svg>' },
  gold_culture_reservation_daily:     { c: '#4a3aa7', cat: '예약 · 가용 현황',
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4m8-4v4M4 11h16M9 15.5l2 2 4-4"/></svg>' },
  gold_culture_sports_schedule:       { c: '#e34948', cat: '스포츠 · 경기 일정',
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 21h8m-4-4v4M6 4h12v5a6 6 0 01-12 0V4z"/><path d="M6 6H4a2 2 0 002 4m12-4h2a2 2 0 01-2 4"/></svg>' },
};
const Q_META = {
  dong_precise: { label: '행정동 정밀', cls: 'g' },
  gu_only:      { label: '구 수준만',   cls: 'w' },
  unmatched:    { label: '매칭 실패',   cls: 's' },
};
const fmt = n => n.toLocaleString('ko-KR');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ident = n => IDENT[n] || { c: '#2a78d6', cat: 'dataset', icon: '' };

let summaries = [], details = {}, view = 'card', activeTab = 0, current = null;

async function boot() {
  const cat = await (await fetch('/api/v1/catalog/tables')).json();
  summaries = cat.tables;
  document.getElementById('snap').innerHTML =
    `스냅샷 ${new Date(cat.generated_at).toLocaleString('ko-KR')}<br><a href="/api/v1/catalog/tables" target="_blank">GET /api/v1/catalog/tables ↗</a>`;
  const all = await Promise.all(summaries.map(t =>
    fetch(`/api/v1/catalog/tables/${t.name}`).then(r => r.json())));
  all.forEach(d => details[d.name] = d);
  renderStats();
  render(summaries);
  document.getElementById('search').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    render(summaries.filter(t => (t.name + ' ' + t.description + ' ' + ident(t.name).cat).toLowerCase().includes(q)));
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
}

function qualityAgg(name) {
  const d = details[name]; if (!d) return null;
  const agg = {};
  d.quality.forEach(q => Object.entries(q.distribution).forEach(([k, v]) => agg[k] = (agg[k] || 0) + v));
  const total = Object.values(agg).reduce((a, b) => a + b, 0);
  return total ? { agg, total, precise: (agg.dong_precise || 0) / total } : null;
}

function renderStats() {
  const totalRows = summaries.reduce((a, t) => a + t.row_count, 0);
  const contract = summaries.filter(t => t.contract_enforced).length;
  let pTot = 0, pPrec = 0; const seen = new Set();
  Object.values(details).forEach(d => d.quality.forEach(q => {
    if (seen.has(q.table)) return; seen.add(q.table);
    Object.entries(q.distribution).forEach(([k, v]) => { pTot += v; if (k === 'dong_precise') pPrec += v; });
  }));
  const rate = pTot ? Math.round(pPrec / pTot * 1000) / 10 : 0;
  document.getElementById('stats').innerHTML = [
    { label: 'Datasets', value: summaries.length, sub: 'published gold' },
    { label: 'Total Rows', value: fmt(totalRows), sub: '스냅샷 실측' },
    { label: 'Contract', value: `${contract}/${summaries.length}`, sub: 'dbt enforced' },
    { label: '공간 정밀 매칭', value: rate + '<span class="unit">%</span>', sub: `silver ${seen.size}개 · ${fmt(pTot)}행` },
  ].map(s => `<div class="stat"><span class="label">${s.label}</span>
      <span class="value num">${s.value}</span><span class="sub">${s.sub}</span></div>`).join('');
}

function meterHtml(agg, total) {
  return '<div class="meter">' + Object.entries(Q_META).filter(([k]) => agg[k])
    .map(([k, m]) => `<i class="${m.cls}" style="flex:${agg[k] / total}" title="${m.label} ${fmt(agg[k])}"></i>`)
    .join('') + '</div>';
}

function setView(v) {
  view = v;
  document.getElementById('vt-card').classList.toggle('on', v === 'card');
  document.getElementById('vt-list').classList.toggle('on', v === 'list');
  const q = document.getElementById('search').value.trim().toLowerCase();
  render(summaries.filter(t => (t.name + ' ' + t.description + ' ' + ident(t.name).cat).toLowerCase().includes(q)));
}

function render(tables) {
  document.getElementById('count').textContent = `${tables.length} / ${summaries.length}`;
  const box = document.getElementById('content');
  if (!tables.length) { box.innerHTML = '<div class="empty">검색 결과가 없습니다</div>'; return; }
  box.innerHTML = view === 'card' ? renderCards(tables) : renderList(tables);
}

function renderCards(tables) {
  return '<div class="cards">' + tables.map(t => {
    const id = ident(t.name), q = qualityAgg(t.name);
    const range = t.date_range && t.date_range.min ? `${t.date_range.min.slice(2)} ~ ${t.date_range.max.slice(2)}` : '—';
    const qfoot = q
      ? `<div class="qwrap">${meterHtml(q.agg, q.total)}
           <div class="qtext num"><b>${(q.precise * 100).toFixed(1)}%</b> 행정동 정밀 · ${fmt(q.total)}행 검사</div></div>`
      : `<div class="qwrap"><div class="qtext">검수된 seed 기반 — quality_status 비대상</div></div>`;
    return `<article class="card" style="--c:${id.c}" onclick="openDrawer('${t.name}')">
      <div class="head">
        <div class="icon">${id.icon}</div>
        <div class="tt"><div class="nm">${esc(t.name.replace('gold_culture_', ''))}</div>
        <div class="cat">${esc(id.cat)}</div></div>
      </div>
      <p class="desc">${esc(t.description) || '설명 없음'}</p>
      <div class="facts num">
        <div class="f"><span>Rows</span><b>${fmt(t.row_count)}</b></div>
        <div class="f"><span>Cols</span><b>${t.column_count}</b></div>
        <div class="f"><span>기간</span><b>${range}</b></div>
      </div>
      <div class="foot">${qfoot}
        ${t.contract_enforced ? '<span class="pill ok">✓ contract</span>' : '<span class="pill dim">—</span>'}
      </div>
    </article>`;
  }).join('') + '</div>';
}

function renderList(tables) {
  const head = `<div class="lrow head"><div>Dataset</div><div style="text-align:right">Rows</div>
    <div style="text-align:right">Cols</div><div>기간</div><div>품질 (행정동 매칭)</div><div>계약</div></div>`;
  return '<div class="listing">' + head + tables.map(t => {
    const id = ident(t.name), q = qualityAgg(t.name);
    const qcell = q
      ? `<div class="qcell">${meterHtml(q.agg, q.total)}
           <div class="qtext num"><b>${(q.precise * 100).toFixed(1)}%</b> 정밀 · ${fmt(q.total)}행</div></div>`
      : `<span class="pill dim">seed 기반</span>`;
    const range = t.date_range && t.date_range.min ? `${t.date_range.min} ~ ${t.date_range.max}` : '—';
    return `<div class="lrow" style="--c:${id.c}" onclick="openDrawer('${t.name}')">
      <div class="nmcell"><div class="micon">${id.icon}</div>
        <div style="min-width:0"><div class="id">${esc(t.name)}</div><div class="ds">${esc(t.description) || '설명 없음'}</div></div></div>
      <div class="cell-num">${fmt(t.row_count)}</div>
      <div class="cell-num">${t.column_count}</div>
      <div class="cell-dim">${range}</div>${qcell}
      <div>${t.contract_enforced ? '<span class="pill ok">✓ enforced</span>' : '<span class="pill dim">—</span>'}</div>
    </div>`;
  }).join('') + '</div>';
}

/* ── drawer ── */
const TABS = t => [['개요', null], ['스키마', t.columns.length], ['품질', t.quality.length],
                   ['샘플', t.sample.length], ['계보', null], ['API', 4]];

function openDrawer(name) {
  current = details[name]; activeTab = 0;
  const id = ident(name);
  const ic = document.getElementById('d-icon');
  ic.style.setProperty('--c', id.c); ic.innerHTML = id.icon;
  document.getElementById('d-title').textContent = current.name;
  document.getElementById('d-rel').textContent = current.relation;
  const dr = current.date_range;
  document.getElementById('d-meta').innerHTML = [
    `<span class="pill dim num">${fmt(current.row_count)} rows</span>`,
    `<span class="pill dim">${current.column_count} columns</span>`,
    dr && dr.min ? `<span class="pill dim num">${dr.min} ~ ${dr.max}</span>` : '',
    current.contract_enforced ? '<span class="pill ok">✓ contract enforced</span>' : '',
    `<span class="pill dim">${esc(current.materialized)}</span>`,
  ].filter(Boolean).join('');
  renderTabs(); renderTab();
  document.getElementById('overlay').classList.add('on');
  document.getElementById('drawer').classList.add('on');
}
function closeDrawer() {
  document.getElementById('overlay').classList.remove('on');
  document.getElementById('drawer').classList.remove('on');
}
function renderTabs() {
  document.getElementById('tabs').innerHTML = TABS(current).map(([label, n], i) =>
    `<button class="${i === activeTab ? 'on' : ''}" onclick="activeTab=${i};renderTabs();renderTab()">
       ${label}${n != null ? `<span class="n">${n}</span>` : ''}</button>`).join('');
}

function renderTab() {
  const t = current, b = document.getElementById('d-body');
  if (activeTab === 0) {
    const dr = t.date_range;
    b.innerHTML = `
      <section><h3>설명</h3><p class="desc">${esc(t.description) || '—'}</p></section>
      <section><h3>속성</h3><div class="kv">
        ${[['행 수', fmt(t.row_count)], ['컬럼 수', t.column_count],
           ['기간 축', dr ? esc(dr.column) : '—'],
           ['기간', dr && dr.min ? `${dr.min} ~ ${dr.max}` : '—'],
           ['materialization', esc(t.materialized)],
           ['contract', t.contract_enforced ? 'enforced' : '—'],
           ['품질 소스', `silver ${t.quality.length}개`],
           ['relation', `<span style="font-family:var(--mono);font-size:11.5px">${esc(t.relation)}</span>`]]
          .map(([k, v]) => `<div class="item"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('')}
      </div></section>`;
  } else if (activeTab === 1) {
    b.innerHTML = `<section><h3>스키마 · ${t.columns.length} columns</h3>
      <div class="scroll-x"><table>
        <tr><th>Column</th><th>Type</th><th>설명</th></tr>
        ${t.columns.map(c => `<tr><td class="mono">${esc(c.name)}</td>
          <td class="mono">${esc(c.type)}</td><td>${esc(c.description) || '<span style="color:var(--ink-3)">—</span>'}</td></tr>`).join('')}
      </table></div></section>`;
  } else if (activeTab === 2) {
    b.innerHTML = `<section><h3>상류 silver quality_status 분포</h3>
      ${t.quality.length ? t.quality.map(q => {
        const total = Object.values(q.distribution).reduce((a, c) => a + c, 0);
        return `<div class="qblock">
          <span class="src">${esc(q.table)}</span><span class="total num">${fmt(total)}행</span>
          ${meterHtml(q.distribution, total)}
          <div class="legend">${Object.entries(Q_META).filter(([k]) => q.distribution[k]).map(([k, m]) =>
            `<span class="li"><span class="dot ${m.cls}"></span>${m.label} ${fmt(q.distribution[k])}
             (${(q.distribution[k] / total * 100).toFixed(1)}%)</span>`).join('')}</div>
        </div>`;
      }).join('') : '<p class="desc">상류 quality_status 없음 — 검수된 seed 기반 테이블</p>'}
    </section>`;
  } else if (activeTab === 3) {
    const cols = t.sample.length ? Object.keys(t.sample[0]) : [];
    b.innerHTML = `<section><h3>샘플 5행 (실데이터)</h3>
      ${t.sample.length ? `<div class="scroll-x"><table>
        <tr>${cols.map(c => `<th class="mono">${esc(c)}</th>`).join('')}</tr>
        ${t.sample.map(r => `<tr>${cols.map(c => {
          const v = r[c];
          return `<td class="${typeof v === 'number' ? 'num-cell' : ''}">${esc(v)}</td>`;
        }).join('')}</tr>`).join('')}
      </table></div>` : '<p class="desc">샘플 없음</p>'}</section>`;
  } else if (activeTab === 4) {
    const order = [['bronze_source', 'Bronze · Source'], ['dim_seed', 'Dim · Seed'],
                   ['intermediate', 'Intermediate'], ['silver', 'Silver']];
    const stages = order.filter(([k]) => t.lineage[k]).map(([k, label]) =>
      `<div class="stage"><div class="t">${label}</div>
       <div class="names">${t.lineage[k].map(n => `<span>${esc(n)}</span>`).join('')}</div></div>`);
    b.innerHTML = `<section><h3>계보 — 상류에서 하류로</h3><div class="flow">
      ${stages.join('<div class="arrow">↓</div>')}
      <div class="arrow">↓</div>
      <div class="stage gold"><div class="t">Gold (this dataset)</div>
        <div class="names"><span>${esc(t.name)}</span></div></div>
    </div></section>`;
  } else {
    const eps = [['', '상세 전부'], ['/schema', '스키마만'], ['/quality', '품질 분포'], ['/sample', '샘플 5행']];
    b.innerHTML = `<section><h3>이 데이터셋의 API</h3><div class="api-list">
      ${eps.map(([sfx, what]) => `<a href="/api/v1/catalog/tables/${t.name}${sfx}" target="_blank">
        <span class="verb">GET</span><span class="path">/api/v1/catalog/tables/${t.name}${sfx}</span>
        <span class="what">${what}</span></a>`).join('')}
    </div></section>`;
  }
}

boot();
</script>
</body>
</html>
