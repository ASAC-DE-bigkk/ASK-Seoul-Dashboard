<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASK SEOUL · Culture Data Marketplace</title>
<style>
  :root {
    --accent: #1a6ce7; --accent-soft: #eaf1fd;
    --ink: #1c2330; --ink-soft: #5b6575; --line: #e3e7ee;
    --ok: #17843f; --ok-soft: #e7f5ec; --warn: #9a6700; --warn-soft: #fff3d6;
    --bg: #f6f8fb; --card: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: "Segoe UI", "Malgun Gothic", system-ui, sans-serif; background: var(--bg); color: var(--ink); }

  header { background: var(--card); border-bottom: 1px solid var(--line); padding: 20px 32px;
           display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 20px; font-weight: 700; }
  header h1 span { color: var(--accent); }
  header .meta { color: var(--ink-soft); font-size: 12.5px; margin-left: auto; text-align: right; }
  header .meta a { color: var(--accent); text-decoration: none; font-weight: 600; }

  .toolbar { max-width: 1160px; margin: 24px auto 0; padding: 0 24px; display: flex; gap: 12px; align-items: center; }
  .toolbar input { flex: 1; max-width: 420px; padding: 10px 14px; border: 1px solid var(--line);
                   border-radius: 8px; font-size: 14px; background: var(--card); }
  .toolbar input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  .toolbar .count { color: var(--ink-soft); font-size: 13px; }

  .grid { max-width: 1160px; margin: 16px auto 48px; padding: 0 24px;
          display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px;
          cursor: pointer; transition: box-shadow .15s, transform .15s; display: flex; flex-direction: column; gap: 10px; }
  .card:hover { box-shadow: 0 6px 20px rgba(26,60,120,.10); transform: translateY(-2px); }
  .card h2 { font-size: 15px; font-weight: 700; word-break: break-all; }
  .card p { color: var(--ink-soft); font-size: 13px; line-height: 1.55;
            display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; }
  .badge { font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
           background: var(--accent-soft); color: var(--accent); font-variant-numeric: tabular-nums; }
  .badge.ok { background: var(--ok-soft); color: var(--ok); }
  .badge.dim { background: #eef0f4; color: var(--ink-soft); }

  dialog { border: none; border-radius: 14px; padding: 0; width: min(880px, 94vw); max-height: 88vh; }
  dialog::backdrop { background: rgba(20,28,45,.45); }
  .modal-head { position: sticky; top: 0; background: var(--card); padding: 20px 26px 14px;
                border-bottom: 1px solid var(--line); display: flex; align-items: start; gap: 12px; z-index: 1; }
  .modal-head h2 { font-size: 17px; word-break: break-all; }
  .modal-head .rel { color: var(--ink-soft); font-size: 12px; font-family: Consolas, monospace; }
  .modal-head button { margin-left: auto; border: none; background: #eef0f4; border-radius: 8px;
                       width: 32px; height: 32px; font-size: 15px; cursor: pointer; }
  .modal-body { padding: 6px 26px 26px; overflow-y: auto; }
  .modal-body h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em;
                   color: var(--ink-soft); margin: 22px 0 10px; }
  .modal-body p.desc { font-size: 13.5px; line-height: 1.6; color: var(--ink); }

  table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  th, td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
  th { background: var(--bg); font-weight: 600; white-space: nowrap; }
  td.mono, th.mono { font-family: Consolas, monospace; font-size: 12px; white-space: nowrap; }
  .scroll-x { overflow-x: auto; border-radius: 8px; }

  .qrow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; font-size: 12.5px; }
  .qrow .src { font-family: Consolas, monospace; color: var(--ink-soft); margin-right: 4px; }
  .chip { padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600;
          background: var(--warn-soft); color: var(--warn); font-variant-numeric: tabular-nums; }
  .chip.ok { background: var(--ok-soft); color: var(--ok); }

  .lineage { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; }
  .lineage .layer { display: flex; gap: 8px; }
  .lineage .layer b { min-width: 120px; color: var(--ink-soft); font-weight: 600; }
  .lineage .layer span { font-family: Consolas, monospace; word-break: break-all; }

  .api-links { display: flex; flex-wrap: wrap; gap: 8px; }
  .api-links a { font-size: 12px; font-family: Consolas, monospace; color: var(--accent);
                 background: var(--accent-soft); padding: 5px 10px; border-radius: 6px; text-decoration: none; }
</style>
</head>
<body>

<header>
  <h1><span>ASK SEOUL</span> · Culture Data Marketplace</h1>
  <div class="meta">
    <div id="meta-line">loading…</div>
    <a href="/docs" target="_blank">API Docs (Swagger) ↗</a>
  </div>
</header>

<div class="toolbar">
  <input id="search" type="search" placeholder="테이블 이름·설명 검색…" autocomplete="off">
  <span class="count" id="count"></span>
</div>

<main class="grid" id="grid"></main>

<dialog id="modal">
  <div class="modal-head">
    <div>
      <h2 id="m-title"></h2>
      <div class="rel" id="m-rel"></div>
    </div>
    <button onclick="modal.close()" aria-label="닫기">✕</button>
  </div>
  <div class="modal-body" id="m-body"></div>
</dialog>

<script>
const grid = document.getElementById('grid');
const modal = document.getElementById('modal');
let all = [];

const fmt = n => n.toLocaleString('ko-KR');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function boot() {
  const res = await fetch('/api/v1/catalog/tables');
  const cat = await res.json();
  all = cat.tables;
  document.getElementById('meta-line').textContent =
    `domain: ${cat.domain} · 스냅샷 ${new Date(cat.generated_at).toLocaleString('ko-KR')}`;
  render(all);
  document.getElementById('search').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    render(all.filter(t => (t.name + ' ' + t.description).toLowerCase().includes(q)));
  });
}

function render(tables) {
  document.getElementById('count').textContent = `${tables.length} / ${all.length} datasets`;
  grid.innerHTML = tables.map(t => `
    <article class="card" onclick="openDetail('${t.name}')">
      <h2>${esc(t.name)}</h2>
      <p>${esc(t.description) || '<i>설명 없음</i>'}</p>
      <div class="badges">
        <span class="badge">${fmt(t.row_count)} rows</span>
        <span class="badge dim">${t.column_count} cols</span>
        ${t.date_range && t.date_range.min ? `<span class="badge dim">${esc(t.date_range.min)} ~ ${esc(t.date_range.max)}</span>` : ''}
        ${t.contract_enforced ? '<span class="badge ok">contract ✓</span>' : ''}
      </div>
    </article>`).join('');
}

async function openDetail(name) {
  const t = await (await fetch(`/api/v1/catalog/tables/${name}`)).json();
  document.getElementById('m-title').textContent = t.name;
  document.getElementById('m-rel').textContent = t.relation + (t.materialized ? ` · ${t.materialized}` : '');

  const schemaRows = t.columns.map(c =>
    `<tr><td class="mono">${esc(c.name)}</td><td class="mono">${esc(c.type)}</td><td>${esc(c.description)}</td></tr>`).join('');

  const quality = t.quality.length ? t.quality.map(q => {
    const chips = Object.entries(q.distribution)
      .map(([k, v]) => `<span class="chip ${k === 'ok' ? 'ok' : ''}">${esc(k)} ${fmt(v)}</span>`).join('');
    return `<div class="qrow"><span class="src">${esc(q.table)}</span>${chips}</div>`;
  }).join('') : '<p class="desc">상류 quality_status 없음 (예: seed 기반 테이블)</p>';

  const sampleCols = t.sample.length ? Object.keys(t.sample[0]) : [];
  const sample = t.sample.length ? `
    <div class="scroll-x"><table>
      <tr>${sampleCols.map(c => `<th class="mono">${esc(c)}</th>`).join('')}</tr>
      ${t.sample.map(r => `<tr>${sampleCols.map(c => `<td>${esc(r[c])}</td>`).join('')}</tr>`).join('')}
    </table></div>` : '<p class="desc">샘플 없음</p>';

  const layerNames = {silver: 'silver', intermediate: 'intermediate', dim_seed: 'dim / seed', bronze_source: 'bronze / source'};
  const lineage = Object.entries(t.lineage).map(([k, v]) =>
    `<div class="layer"><b>${layerNames[k] || k}</b><span>${v.map(esc).join(', ')}</span></div>`).join('');

  const api = ['', '/schema', '/quality', '/sample']
    .map(sfx => `<a href="/api/v1/catalog/tables/${t.name}${sfx}" target="_blank">GET …/${t.name}${sfx}</a>`).join('');

  document.getElementById('m-body').innerHTML = `
    <h3>개요</h3><p class="desc">${esc(t.description) || '-'}</p>
    <h3>스키마 (${t.columns.length})</h3>
    <div class="scroll-x"><table><tr><th>column</th><th>type</th><th>설명</th></tr>${schemaRows}</table></div>
    <h3>품질 — 상류 silver quality_status</h3>${quality}
    <h3>샘플 5행</h3>${sample}
    <h3>계보 (upstream)</h3><div class="lineage">${lineage}</div>
    <h3>API</h3><div class="api-links">${api}</div>`;
  modal.showModal();
}

boot();
</script>
</body>
</html>
