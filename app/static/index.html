<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASK SEOUL · Data Catalog</title>
<style>
  :root {
    /* palette — dataviz reference instance */
    --accent: #2a78d6; --accent-deep: #256abf; --accent-soft: #e8f0fb;
    --good: #0ca30c; --warn: #fab219; --serious: #ec835a;
    --good-soft: #e9f6e9; --warn-soft: #fdf3dc; --serious-soft: #fcebe4;
    --bar-ink: #eef2f8; --bar-bg: #0f1c33; --bar-line: #24334e;
    --ink: #1a2333; --ink-2: #4a5568; --ink-3: #8a94a6;
    --line: #dde3ec; --line-soft: #e9edf4;
    --bg: #f2f5f9; --panel: #ffffff;
    --mono: Consolas, "Cascadia Mono", monospace;
    --shadow: 0 1px 2px rgba(16,30,54,.05), 0 4px 16px rgba(16,30,54,.06);
  }
  * { box-sizing: border-box; margin: 0; }
  html { font-size: 14px; }
  body { font-family: "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
         background: var(--bg); color: var(--ink); line-height: 1.5; }
  .num { font-variant-numeric: tabular-nums; }

  /* ── app bar ─────────────────────────────────────────── */
  .appbar { background: var(--bar-bg); color: var(--bar-ink); height: 56px;
            display: flex; align-items: center; gap: 20px; padding: 0 28px;
            position: sticky; top: 0; z-index: 30; }
  .brand { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; }
  .brand b { font-size: 15px; letter-spacing: .02em; }
  .brand span { font-size: 12.5px; color: #9fb0cc; border-left: 1px solid var(--bar-line); padding-left: 10px; }
  .domain-chip { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
                 background: rgba(42,120,214,.28); color: #bcd6f7; border: 1px solid rgba(120,170,230,.35);
                 padding: 3px 10px; border-radius: 999px; }
  .appbar .spacer { flex: 1; }
  .appbar .snap { font-size: 12px; color: #9fb0cc; }
  .appbar a.docs { font-size: 12.5px; font-weight: 600; color: #fff; text-decoration: none;
                   background: var(--accent-deep); padding: 7px 14px; border-radius: 7px; }
  .appbar a.docs:hover { background: var(--accent); }

  .shell { max-width: 1240px; margin: 0 auto; padding: 24px 28px 64px; }

  /* ── stat band ───────────────────────────────────────── */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
           gap: 14px; margin-bottom: 22px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
          padding: 14px 18px 12px; box-shadow: var(--shadow); }
  .stat .label { font-size: 11.5px; font-weight: 600; letter-spacing: .07em;
                 text-transform: uppercase; color: var(--ink-3); }
  .stat .value { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; margin-top: 2px; }
  .stat .sub { font-size: 12px; color: var(--ink-2); margin-top: 1px; }
  .stat .value .unit { font-size: 13px; font-weight: 600; color: var(--ink-3); margin-left: 4px; }

  /* ── toolbar ─────────────────────────────────────────── */
  .toolbar { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
  .toolbar h2 { font-size: 15px; font-weight: 700; }
  .toolbar .count { font-size: 12.5px; color: var(--ink-3); }
  .toolbar input { margin-left: auto; width: 320px; padding: 8px 14px; font-size: 13px;
                   border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
  .toolbar input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }

  /* ── dataset table ───────────────────────────────────── */
  .listing { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
             box-shadow: var(--shadow); overflow: hidden; }
  .lrow { display: grid; grid-template-columns: minmax(320px,1fr) 110px 64px 190px 170px 104px;
          gap: 16px; align-items: center; padding: 13px 22px;
          border-top: 1px solid var(--line-soft); cursor: pointer; }
  .lrow:hover { background: #f7fafd; }
  .lrow.head { background: #fafbfd; border-top: none; cursor: default; padding: 10px 22px;
               font-size: 11.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase;
               color: var(--ink-3); position: sticky; top: 56px; z-index: 10; }
  .lrow.head:hover { background: #fafbfd; }
  .ds-name { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .ds-name .id { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--ink);
                 overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .layer-chip { font-size: 10px; font-weight: 700; letter-spacing: .08em; color: #8d6708;
                background: #fbf0cd; border-radius: 4px; padding: 2px 6px; flex: none; }
  .ds-desc { grid-column: 1; font-size: 12.5px; color: var(--ink-2); margin-top: 3px;
             overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cell-num { text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; }
  .cell-dim { font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }

  .qcell { display: flex; flex-direction: column; gap: 4px; }
  .meter { display: flex; height: 6px; border-radius: 4px; overflow: hidden; gap: 2px; background: var(--line-soft); }
  .meter i { display: block; height: 100%; }
  .meter i.g { background: var(--good); } .meter i.w { background: var(--warn); } .meter i.s { background: var(--serious); }
  .qcell .qtext { font-size: 11.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .qcell .qtext b { color: var(--good); }

  .pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600;
          padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
  .pill.ok { background: var(--good-soft); color: #0a7d0a; }
  .pill.dim { background: var(--line-soft); color: var(--ink-2); }

  /* ── drawer ──────────────────────────────────────────── */
  .overlay { position: fixed; inset: 0; background: rgba(15,28,51,.42); opacity: 0;
             pointer-events: none; transition: opacity .18s; z-index: 40; }
  .overlay.on { opacity: 1; pointer-events: auto; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(680px, 94vw);
            background: var(--panel); box-shadow: -12px 0 40px rgba(16,30,54,.18);
            transform: translateX(102%); transition: transform .22s ease; z-index: 50;
            display: flex; flex-direction: column; }
  .drawer.on { transform: translateX(0); }
  .d-head { padding: 20px 26px 0; border-bottom: 1px solid var(--line); }
  .d-head .top { display: flex; align-items: flex-start; gap: 12px; }
  .d-head h2 { font-family: var(--mono); font-size: 16px; word-break: break-all; }
  .d-head .rel { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); margin-top: 3px; }
  .d-head .close { margin-left: auto; flex: none; border: 1px solid var(--line); background: var(--panel);
                   border-radius: 8px; width: 30px; height: 30px; font-size: 13px; cursor: pointer; color: var(--ink-2); }
  .d-head .close:hover { background: var(--bg); }
  .d-meta { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 14px; }
  .tabs { display: flex; gap: 2px; }
  .tabs button { border: none; background: none; font: inherit; font-size: 13px; font-weight: 600;
                 color: var(--ink-2); padding: 9px 14px; cursor: pointer;
                 border-bottom: 2px solid transparent; }
  .tabs button.on { color: var(--accent-deep); border-bottom-color: var(--accent); }
  .tabs button:hover { color: var(--ink); }
  .d-body { flex: 1; overflow-y: auto; padding: 20px 26px 32px; }
  .d-body h3 { font-size: 11.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase;
               color: var(--ink-3); margin: 0 0 10px; }
  .d-body section + section { margin-top: 24px; }
  .d-body p.desc { font-size: 13.5px; color: var(--ink); }

  .kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
  .kv .item { background: var(--bg); border: 1px solid var(--line-soft); border-radius: 8px; padding: 9px 12px; }
  .kv .k { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
  .kv .v { font-size: 13.5px; font-weight: 600; margin-top: 1px; font-variant-numeric: tabular-nums; }

  table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  th, td { border-bottom: 1px solid var(--line-soft); padding: 7px 10px; text-align: left; vertical-align: top; }
  th { background: #fafbfd; font-size: 11px; font-weight: 600; letter-spacing: .06em;
       text-transform: uppercase; color: var(--ink-3); white-space: nowrap;
       border-bottom: 1px solid var(--line); }
  tr:hover td { background: #f7fafd; }
  td.mono, th.mono { font-family: var(--mono); font-size: 12px; white-space: nowrap; }
  td.num-cell { text-align: right; font-variant-numeric: tabular-nums; }
  .scroll-x { overflow-x: auto; border: 1px solid var(--line-soft); border-radius: 8px; }
  .scroll-x table th:first-child, .scroll-x table td:first-child { padding-left: 14px; }

  .qblock { border: 1px solid var(--line-soft); border-radius: 10px; padding: 14px 16px; }
  .qblock + .qblock { margin-top: 10px; }
  .qblock .src { font-family: var(--mono); font-size: 12.5px; font-weight: 600; }
  .qblock .total { font-size: 11.5px; color: var(--ink-3); margin-left: 6px; }
  .qblock .meter { height: 10px; margin: 10px 0 8px; border-radius: 5px; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--ink-2); }
  .legend .li { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
  .dot { width: 9px; height: 9px; border-radius: 3px; flex: none; }
  .dot.g { background: var(--good); } .dot.w { background: var(--warn); } .dot.s { background: var(--serious); }

  .flow { display: flex; flex-direction: column; gap: 0; }
  .stage { border: 1px solid var(--line-soft); border-radius: 10px; padding: 12px 16px; background: var(--bg); }
  .stage .t { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px; }
  .stage .names { display: flex; flex-wrap: wrap; gap: 6px; }
  .stage .names span { font-family: var(--mono); font-size: 11.5px; background: var(--panel);
                       border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; }
  .stage.gold { background: #fffaf0; border-color: #f0e2bd; }
  .arrow { text-align: center; color: var(--ink-3); font-size: 13px; padding: 4px 0; }

  .api-list { display: flex; flex-direction: column; gap: 8px; }
  .api-list a { display: flex; align-items: center; gap: 10px; text-decoration: none;
                border: 1px solid var(--line-soft); border-radius: 8px; padding: 9px 14px; }
  .api-list a:hover { border-color: var(--accent); background: var(--accent-soft); }
  .api-list .verb { font-size: 10.5px; font-weight: 700; letter-spacing: .05em; color: var(--good);
                    background: var(--good-soft); border-radius: 4px; padding: 2px 7px; flex: none; }
  .api-list .path { font-family: var(--mono); font-size: 12px; color: var(--ink); word-break: break-all; }
  .api-list .what { margin-left: auto; font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }

  .empty { padding: 48px; text-align: center; color: var(--ink-3); font-size: 13.5px; }
</style>
</head>
<body>

<div class="appbar">
  <div class="brand"><b>ASK SEOUL</b><span>Data Catalog</span></div>
  <span class="domain-chip">culture</span>
  <div class="spacer"></div>
  <span class="snap num" id="snap"></span>
  <a class="docs" href="/docs" target="_blank">API Docs ↗</a>
</div>

<div class="shell">
  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <h2>Published Datasets</h2>
    <span class="count num" id="count"></span>
    <input id="search" type="search" placeholder="이름·설명 검색" autocomplete="off">
  </div>

  <div class="listing" id="listing"></div>
</div>

<div class="overlay" id="overlay" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer" aria-label="dataset detail">
  <div class="d-head">
    <div class="top">
      <div>
        <h2 id="d-title"></h2>
        <div class="rel" id="d-rel"></div>
      </div>
      <button class="close" onclick="closeDrawer()" aria-label="닫기">✕</button>
    </div>
    <div class="d-meta" id="d-meta"></div>
    <nav class="tabs" id="tabs"></nav>
  </div>
  <div class="d-body" id="d-body"></div>
</aside>

<script>
const Q_META = {
  dong_precise: { label: '행정동 정밀', cls: 'g' },
  gu_only:      { label: '구 수준만',   cls: 'w' },
  unmatched:    { label: '매칭 실패',   cls: 's' },
};
const TABS = ['개요', '스키마', '품질', '샘플', '계보', 'API'];
const fmt = n => n.toLocaleString('ko-KR');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let summaries = [], details = {}, activeTab = 0, current = null;

async function boot() {
  const cat = await (await fetch('/api/v1/catalog/tables')).json();
  summaries = cat.tables;
  document.getElementById('snap').textContent =
    '스냅샷 ' + new Date(cat.generated_at).toLocaleString('ko-KR');
  const all = await Promise.all(summaries.map(t =>
    fetch(`/api/v1/catalog/tables/${t.name}`).then(r => r.json())));
  all.forEach(d => details[d.name] = d);
  renderStats();
  renderList(summaries);
  document.getElementById('search').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    renderList(summaries.filter(t => (t.name + ' ' + t.description).toLowerCase().includes(q)));
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
}

function qualityAgg(name) {
  const d = details[name]; if (!d) return null;
  const agg = {};
  d.quality.forEach(q => Object.entries(q.distribution).forEach(([k, v]) => agg[k] = (agg[k] || 0) + v));
  const total = Object.values(agg).reduce((a, b) => a + b, 0);
  return total ? { agg, total, precise: (agg.dong_precise || 0) / total } : null;
}

function renderStats() {
  const totalRows = summaries.reduce((a, t) => a + t.row_count, 0);
  const contract = summaries.filter(t => t.contract_enforced).length;
  let pTot = 0, pPrec = 0;
  const seen = new Set();
  Object.values(details).forEach(d => d.quality.forEach(q => {
    if (seen.has(q.table)) return; seen.add(q.table);
    Object.entries(q.distribution).forEach(([k, v]) => { pTot += v; if (k === 'dong_precise') pPrec += v; });
  }));
  const preciseRate = pTot ? Math.round(pPrec / pTot * 1000) / 10 : 0;
  document.getElementById('stats').innerHTML = [
    { label: 'Published Datasets', value: summaries.length, sub: 'culture gold layer' },
    { label: 'Total Rows', value: fmt(totalRows), sub: '스냅샷 기준 실측' },
    { label: 'Contract Coverage', value: `${contract}/${summaries.length}`, sub: 'dbt contract enforced' },
    { label: '공간 정밀 매칭률', value: preciseRate + '<span class="unit">%</span>', sub: `상류 silver ${seen.size}개 · ${fmt(pTot)}행` },
  ].map(s => `<div class="stat"><div class="label">${s.label}</div>
      <div class="value num">${s.value}</div><div class="sub">${s.sub}</div></div>`).join('');
}

function meterHtml(agg, total) {
  return '<div class="meter">' + Object.entries(Q_META)
    .filter(([k]) => agg[k])
    .map(([k, m]) => `<i class="${m.cls}" style="flex:${agg[k] / total}" title="${m.label} ${fmt(agg[k])}"></i>`)
    .join('') + '</div>';
}

function renderList(tables) {
  document.getElementById('count').textContent = `${tables.length} / ${summaries.length}`;
  const head = `<div class="lrow head"><div>Dataset</div><div style="text-align:right">Rows</div>
    <div style="text-align:right">Cols</div><div>기간</div><div>품질 (행정동 매칭)</div><div>계약</div></div>`;
  if (!tables.length) {
    document.getElementById('listing').innerHTML = head + '<div class="empty">검색 결과가 없습니다</div>';
    return;
  }
  document.getElementById('listing').innerHTML = head + tables.map(t => {
    const q = qualityAgg(t.name);
    const qcell = q
      ? `<div class="qcell">${meterHtml(q.agg, q.total)}
           <span class="qtext"><b>${(q.precise * 100).toFixed(1)}%</b> 정밀 · ${fmt(q.total)}행</span></div>`
      : `<span class="pill dim">seed 기반</span>`;
    const range = t.date_range && t.date_range.min ? `${t.date_range.min} ~ ${t.date_range.max}` : '—';
    return `<div class="lrow" onclick="openDrawer('${t.name}')">
      <div style="min-width:0">
        <div class="ds-name"><span class="layer-chip">GOLD</span><span class="id">${esc(t.name)}</span></div>
        <div class="ds-desc">${esc(t.description) || '설명 없음'}</div>
      </div>
      <div class="cell-num">${fmt(t.row_count)}</div>
      <div class="cell-num">${t.column_count}</div>
      <div class="cell-dim">${range}</div>
      ${qcell}
      <div>${t.contract_enforced ? '<span class="pill ok">✓ enforced</span>' : '<span class="pill dim">—</span>'}</div>
    </div>`;
  }).join('');
}

function openDrawer(name) {
  current = details[name]; activeTab = 0;
  document.getElementById('d-title').textContent = current.name;
  document.getElementById('d-rel').textContent = current.relation;
  const dr = current.date_range;
  document.getElementById('d-meta').innerHTML = [
    `<span class="pill dim num">${fmt(current.row_count)} rows</span>`,
    `<span class="pill dim">${current.column_count} columns</span>`,
    dr && dr.min ? `<span class="pill dim num">${dr.min} ~ ${dr.max}</span>` : '',
    current.contract_enforced ? '<span class="pill ok">✓ contract enforced</span>' : '',
    `<span class="pill dim">${esc(current.materialized)}</span>`,
  ].filter(Boolean).join('');
  renderTabs(); renderTab();
  document.getElementById('overlay').classList.add('on');
  document.getElementById('drawer').classList.add('on');
}
function closeDrawer() {
  document.getElementById('overlay').classList.remove('on');
  document.getElementById('drawer').classList.remove('on');
}
function renderTabs() {
  document.getElementById('tabs').innerHTML = TABS.map((t, i) =>
    `<button class="${i === activeTab ? 'on' : ''}" onclick="activeTab=${i};renderTabs();renderTab()">${t}</button>`).join('');
}

function renderTab() {
  const t = current, b = document.getElementById('d-body');
  if (activeTab === 0) {  // 개요
    const dr = t.date_range;
    b.innerHTML = `
      <section><h3>설명</h3><p class="desc">${esc(t.description) || '—'}</p></section>
      <section><h3>속성</h3><div class="kv">
        ${[['행 수', fmt(t.row_count)], ['컬럼 수', t.column_count],
           ['기간 축', dr ? esc(dr.column) : '—'],
           ['기간', dr && dr.min ? `${dr.min} ~ ${dr.max}` : '—'],
           ['materialization', esc(t.materialized)],
           ['contract', t.contract_enforced ? 'enforced' : '—'],
           ['품질 소스', `silver ${t.quality.length}개`],
           ['relation', `<span style="font-family:var(--mono);font-size:12px">${esc(t.relation)}</span>`]]
          .map(([k, v]) => `<div class="item"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('')}
      </div></section>`;
  } else if (activeTab === 1) {  // 스키마
    b.innerHTML = `<section><h3>스키마 · ${t.columns.length} columns</h3>
      <div class="scroll-x"><table>
        <tr><th>Column</th><th>Type</th><th>설명</th></tr>
        ${t.columns.map(c => `<tr><td class="mono">${esc(c.name)}</td>
          <td class="mono">${esc(c.type)}</td><td>${esc(c.description) || '<span style="color:var(--ink-3)">—</span>'}</td></tr>`).join('')}
      </table></div></section>`;
  } else if (activeTab === 2) {  // 품질
    b.innerHTML = `<section><h3>상류 silver quality_status 분포</h3>
      ${t.quality.length ? t.quality.map(q => {
        const total = Object.values(q.distribution).reduce((a, c) => a + c, 0);
        return `<div class="qblock">
          <span class="src">${esc(q.table)}</span><span class="total num">${fmt(total)}행</span>
          ${meterHtml(q.distribution, total)}
          <div class="legend">${Object.entries(Q_META).filter(([k]) => q.distribution[k]).map(([k, m]) =>
            `<span class="li"><span class="dot ${m.cls}"></span>${m.label} ${fmt(q.distribution[k])}
             (${(q.distribution[k] / total * 100).toFixed(1)}%)</span>`).join('')}</div>
        </div>`;
      }).join('') : '<p class="desc">상류 quality_status 없음 — seed 기반 테이블</p>'}
    </section>`;
  } else if (activeTab === 3) {  // 샘플
    const cols = t.sample.length ? Object.keys(t.sample[0]) : [];
    b.innerHTML = `<section><h3>샘플 5행 (실데이터)</h3>
      ${t.sample.length ? `<div class="scroll-x"><table>
        <tr>${cols.map(c => `<th class="mono">${esc(c)}</th>`).join('')}</tr>
        ${t.sample.map(r => `<tr>${cols.map(c => {
          const v = r[c];
          return `<td class="${typeof v === 'number' ? 'num-cell' : ''}">${esc(v)}</td>`;
        }).join('')}</tr>`).join('')}
      </table></div>` : '<p class="desc">샘플 없음</p>'}</section>`;
  } else if (activeTab === 4) {  // 계보
    const order = [['bronze_source', 'Bronze · Source'], ['dim_seed', 'Dim · Seed'],
                   ['intermediate', 'Intermediate'], ['silver', 'Silver']];
    const stages = order.filter(([k]) => t.lineage[k]).map(([k, label]) =>
      `<div class="stage"><div class="t">${label}</div>
       <div class="names">${t.lineage[k].map(n => `<span>${esc(n)}</span>`).join('')}</div></div>`);
    b.innerHTML = `<section><h3>계보 — 상류에서 하류로</h3><div class="flow">
      ${stages.join('<div class="arrow">↓</div>')}
      <div class="arrow">↓</div>
      <div class="stage gold"><div class="t">Gold (this)</div>
        <div class="names"><span>${esc(t.name)}</span></div></div>
    </div></section>`;
  } else {  // API
    const eps = [['', '상세 전부'], ['/schema', '스키마만'], ['/quality', '품질 분포'], ['/sample', '샘플 5행']];
    b.innerHTML = `<section><h3>이 데이터셋의 API</h3><div class="api-list">
      ${eps.map(([sfx, what]) => `<a href="/api/v1/catalog/tables/${t.name}${sfx}" target="_blank">
        <span class="verb">GET</span><span class="path">/api/v1/catalog/tables/${t.name}${sfx}</span>
        <span class="what">${what}</span></a>`).join('')}
    </div></section>`;
  }
}

boot();
</script>
</body>
</html>
